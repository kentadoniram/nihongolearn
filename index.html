 $('#m').innerHTML=`<div class="card"><b>Vocabulary</b>${['5','4','3','W'].map(bar).join('')}${ch('lv',[['','All'],['5','N5'],['4','N4'],['3','N3'],['W','Work']])}${ch('st',[['','Any status'],['new','New'],['learning','Learning'],['solid','Solid']])}${lss.length?ch('ls',[['','All lessons'],...lss.map(x=>[x,x])]):''}<input id="vq" placeholder="Search word, reading, romaji or meaning" value="${e(F.q||'')}" oninput="S.vf.q=this.value;S.vf.n=40;vocabList()" style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font-size:1rem"></div><div class="card" id="vl"></div><button class="sec" onclick="go('g')">Back to Progress</button>`;vocabList()}
function vocabList(){const F=S.vf,A=W().filter(w=>!w.g),q=(F.q||'').toLowerCase(),now=Date.now(),lvO=w=>w.t?'W':String(w.l),stO=w=>{const it=S.i[w.w];return!it?'new':it.s>=7?'solid':'learning'};
 const R=A.filter(w=>(!F.lv||lvO(w)==F.lv)&&(!F.st||stO(w)==F.st)&&(!F.ls||w.ls==F.ls)&&(!q||(w.w+' '+w.r+' '+romaji(w.r)+' '+w.m).toLowerCase().includes(q))).sort((a,b)=>(ZR[a.w]||999)-(ZR[b.w]||999));
 $('#vl').innerHTML=`<p class="mu" style="text-align:left;margin:0 0 4px">${R.length} words, ordered by everyday use</p>`+R.slice(0,F.n).map(w=>{const it=S.i[w.w],st=stO(w);return`<div class="vr" onclick="dict(${W().indexOf(w)})" style="cursor:pointer"><span>${ruby(w,1)} ${lvb(w)}<br><span class="mu">${e(w.m)}</span></span><span class="pill ${st=='solid'?'s':''}">${st=='new'?'new':Math.round(ret(it,now)*100)+'% '+st}</span></div>`}).join('')+(R.length>F.n?`<button class="sec" onclick="S.vf.n+=40;vocabList()">Show more</button>`:'')}
function roadmap(){const R=RMP,c=k=>R.filter(x=>x.s==k),d=c('done').length,nm={done:'Done',doing:'In progress',planned:'Not started'},pc=Math.round(d/Math.max(1,R.length)*100);
 $('#m').innerHTML=`<div class="card"><b>Roadmap</b><p class="mu" style="text-align:left">${d} of ${R.length} items done (${pc}%). App version ${e(VER.app)}.</p><div class="bar"><i style="width:${pc}%"></i></div></div>`+['doing','planned','done'].map(k=>`<div class="card"><b>${nm[k]} (${c(k).length})</b>${c(k).map(x=>`<div class="stat"><span>${e(x.t)}<br><span class="mu">${e(x.a)}${x.n?': '+e(x.n):''}</span></span></div>`).join('')}</div>`).join('')+`<button class="sec" onclick="go('g')">Back to Progress</button>`}
try{navigator.storage.persist()}catch(x){}
function banner(){setFont();const b=$('#bn');if(!b)return;const old=!S.bk||Date.now()-S.bk>6048e5,sn=S.bs&&Date.now()-S.bs<864e5;
 b.innerHTML=Object.keys(S.i).length>3&&old&&!sn?`<div class="bn"><span>${S.bk?'Backup is over a week old':'No backup yet'}</span><button class="mini" onclick="exp()">Save</button><button class="mini" aria-label="Dismiss" onclick="S.bs=Date.now();save();banner()">×</button></div>`:''}
let dg=null;
function diag(){DX=diagBuild();dg={i:0,r:[]};go('p',1);dq()}
function dq(){const q=DX[dg.i];q.p=shuffle(q.o.map((t,i)=>({t,c:i==q.a})));
 $('#m').innerHTML=`<div class="card"><p class="mu">Question ${dg.i+1} of ${DX.length}</p><p style="font-size:1.3rem;text-align:center;margin:8px 0">${e(q.q)}</p><div id="dc">${q.p.map((o,j)=>`<button class="opt" onclick="da(${j})">${e(o.t)}</button>`).join('')}<button class="opt" style="color:var(--mu)" onclick="da(-1)">I don’t know yet</button></div></div><div id="fb"></div>`}
function da(j){const q=DX[dg.i],ok=j>=0&&q.p[j].c,id=q.id||q.w,w=W().find(x=>x.w==id);
 if(w)learn(feat(w,q.c=='g'?'gq':'jm',null),ok?1:0,w.w);dg.r.push({q,ok});
 document.querySelectorAll('#dc .opt').forEach((b,k)=>{b.disabled=true;if(q.p[k]&&q.p[k].c)b.classList.add('ok');else if(k==j)b.classList.add('bad')});
 $('#fb').innerHTML=`<div class="card fb ${ok?'':'r'}"><b>${ok?'Correct':j<0?'No problem, here is how it works':'Not quite'}</b><p>Answer: ${e(q.o[q.a])}</p>${q.w&&WM[q.w]?trioW(WM[q.w]):''}<p>${e(q.y)}</p><button class="pri" onclick="dn()">${dg.i+1<DX.length?'Next':'See my result'}</button></div>`}
function dn(){dg.i++;if(dg.i<DX.length)return dq();
 const n=Date.now(),c=l=>{const r=dg.r.filter(x=>x.q.l==l);return[r.filter(x=>x.ok).length,r.length]},a=c(5),b=c(4);
 dg.r.forEach(x=>{if(!x.ok)return;const id=x.q.id||x.q.w;if(W().some(y=>y.w==id)&&!S.i[id])S.i[id]={s:3,d:4,t:n,f:n,n:1,l:0,x:{}}});
 const lv=a[0]/a[1]<.5?'N5 basics':b[0]/b[1]<.5?'N5 solid, ready to start N4':'N4 working level';
 S.diag={t:n,n5:a,n4:b,lv};save();
 $('#m').innerHTML=`<div class="card"><b>Your starting point: ${lv}</b><p>N5 questions: ${a[0]} of ${a[1]}. N4 questions: ${b[0]} of ${b[1]}.</p><p class="mu" style="text-align:left">Words you got right are scheduled for review instead of being taught again. Everything else is introduced step by step.</p><button class="pri" onclick="practice()">Start practising</button></div>`}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
loadContent().then(()=>go('t')).catch(x=>{$('#m').innerHTML='<div class="card"><b>Lesson files could not be loaded</b><p>'+e(x.message)+'</p><p class="mu" style="text-align:left">Keep content.json and the n5, n4, n3 .json files in a folder called data next to index.html (or all in the same folder as index.html), and open the app from its web address, not by double-clicking the file.</p></div>'});
</script></body></html>
