<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nihongo Lab</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f3a5f">
<style>
:root{--bg:#eef1f4;--grid:#dde3ea;--fg:#17202b;--mu:#5d6b7a;--card:#fbfcfd;--ink:#1f3a5f;--hi:#f3dc5b;--ok:#2e7d5b;--bad:#b3362f;--bd:#c3ccd6;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12171d;--grid:#1b232c;--fg:#e6ebf0;--mu:#8b99a8;--card:#18202a;--ink:#8fb3e8;--hi:#6b5d14;--ok:#5cc08f;--bad:#ef7d74;--bd:#2c3744;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px;color:var(--fg);font:16px/1.55 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font:600 1.15rem "Hiragino Mincho ProN","Noto Serif JP","Yu Mincho",serif;margin:0;color:var(--ink)}
nav{display:flex;gap:4px}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:3px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:16px;margin-bottom:12px}
.big{font:600 2.8rem/1.5 "Hiragino Mincho ProN","Noto Serif JP","Yu Mincho",serif;color:var(--ink);text-align:center;margin:4px 0}
rt{font-size:.9rem;font-weight:400}
.mean{text-align:center;font-size:1.2rem;margin:4px 0}
.mu{color:var(--mu);font-size:.9rem;margin:4px 0;text-align:center}
.bar{height:4px;background:var(--grid);margin:6px 24px 10px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
button{font:inherit}
.opt,.pri,.btn,.sec{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--bd);border-radius:4px;background:var(--card);color:var(--fg);cursor:pointer;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);text-align:center}
.sec,.btn{display:inline-block;width:auto;text-align:center;margin:4px 4px 4px 0}
input#ti{width:100%;font-size:1.3rem;padding:10px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--fg);margin:8px 0}
.fb{border-left:4px solid var(--ok)}.fb.r{border-left-color:var(--bad)}
.ex{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.ex span{background:var(--bg);border:1px solid var(--bd);border-radius:3px;padding:4px 8px;text-align:center}
.ex big{display:block;font-size:1.2rem;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif}.ex small{color:var(--mu)}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid span{background:var(--hi);color:var(--fg);padding:2px 7px;border-radius:3px;font-size:.95rem}
a{color:var(--ink)}:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style></head><body><div class="w">
<header><h1>日本語 Lab</h1><nav><button data-v="p" onclick="go('p')">Practice</button><button data-v="l" onclick="go('l')">Patterns</button><button data-v="g" onclick="go('g')">Progress</button></nav></header>
<main id="m"></main>
<p class="mu"><a href="#" onclick="practice(1);go('p',1);return false">Learn a new word now</a></p>
</div>
<script>
const V=`学校|がっこう|school|5
先生|せんせい|teacher|5
学生|がくせい|student|5
大学|だいがく|university|5
日本|にほん|Japan|5
日本人|にほんじん|Japanese person|5
外国人|がいこくじん|foreign person|5
中国人|ちゅうごくじん|Chinese person|5
水|みず|water|5
火|ひ|fire|5
木|き|tree|5
金|かね|money|5
本|ほん|book|5
人|ひと|person|5
大きい|おおきい|big|5
小さい|ちいさい|small|5
食べる|たべる|to eat|5
飲む|のむ|to drink|5
見る|みる|to see|5
行く|いく|to go|5
来る|くる|to come|5
話す|はなす|to speak|5
読む|よむ|to read|5
書く|かく|to write|5
聞く|きく|to listen, to ask|5
言う|いう|to say|5
買う|かう|to buy|5
今日|きょう|today|5
明日|あした|tomorrow|5
毎日|まいにち|every day|5
時間|じかん|time|5
電話|でんわ|telephone|5
電車|でんしゃ|train|5
駅|えき|station|5
友達|ともだち|friend|5
天気|てんき|weather|5
会社|かいしゃ|company|5
休み|やすみ|day off, rest|5
右|みぎ|right|5
左|ひだり|left|5
上|うえ|above|5
下|した|below|5
コーヒー|コーヒー|coffee|5
ホテル|ホテル|hotel|5
テレビ|テレビ|TV|5
レストラン|レストラン|restaurant|5
開ける|あける|to open (something)|4
開く|あく|to open (by itself)|4
閉める|しめる|to close (something)|4
閉まる|しまる|to close (by itself)|4
始める|はじめる|to start (something)|4
始まる|はじまる|to begin (by itself)|4
消す|けす|to turn off, to erase|4
消える|きえる|to go out, to vanish|4
運動|うんどう|exercise|4
勉強|べんきょう|study|4
料理|りょうり|cooking|4
便利|べんり|convenient|4
会議|かいぎ|meeting|4
旅行|りょこう|travel|4
意味|いみ|meaning|4
場所|ばしょ|place|4
病院|びょういん|hospital|4
自転車|じてんしゃ|bicycle|4
野菜|やさい|vegetables|4
理由|りゆう|reason|4
予定|よてい|plan, schedule|4
心配|しんぱい|worry|4`.split("\n").map(l=>{const a=l.split("|");return{w:a[0],r:a[1],m:a[2],l:+a[3]}});
const LAB=[
{t:"Place + 人 means a person from there",ex:[["日本人","Japanese person"],["中国人","Chinese person"],["外国人","foreign person"]],q:"What does adding 人 (じん) after a place do?",o:["Makes 'a person from there'","Makes 'the language of there'","Makes 'the food of there'"],a:0,y:"Place + 人 = person from it. The same slot with 語 gives the language. Exception for your ledger: 人 alone is ひと."},
{t:"Pairs: someone does it, or it happens",ex:[["開ける","open (something)"],["開く","open (by itself)"],["閉める","close (something)"],["閉まる","close (by itself)"],["始める","start (something)"],["始まる","begin (by itself)"]],q:"Which group means 'someone does it to something'?",o:["開ける, 閉める, 始める","開く, 閉まる, 始まる","There is no difference"],a:0,y:"Tendency: endings like -eru/-su belong to the doer, endings like -u/-aru to things that happen on their own. A tendency, not a law, so exceptions will come back later."},
{t:"Katakana is English sound in Japanese clothes",ex:[["コーヒー","coffee"],["ホテル","hotel"],["テレビ","TV"],["レストラン","restaurant"]],q:"ジュース is most likely…",o:["juice","jealousy","a kind of tree"],a:0,y:"Say it aloud with Japanese sounds: ju-u-su. The long mark ー just stretches the vowel. Decode first, memorize second."}];
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='nihongoLab1',K=/[\u4e00-\u9fff]/;
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(x){}
S=S||{};S.i=S.i||{};S.lab=S.lab||{};S.custom=S.custom||[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}};
const W=()=>V.concat(S.custom),rnd=a=>a[Math.random()*a.length|0],shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
// Forgetting curve (FSRS-style power law): R=0.9 when t=S days.
const ret=(it,n)=>Math.pow(1+19/81*((n-it.t)/864e5)/it.s,-.5);
let cur=null;
function go(v,skip){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));if(skip)return;v=='p'?practice():v=='l'?lab():prog()}
function ruby(w,on){return on&&K.test(w.w)?`<ruby>${e(w.w)}<rt>${e(w.r)}</rt></ruby>`:e(w.w)}
function pick(fn){const now=Date.now(),all=W(),L=all.filter(w=>S.i[w.w]),un=all.filter(w=>!S.i[w.w]);
 const day=new Date().setHours(0,0,0,0),nt=L.filter(w=>S.i[w.w].f>=day).length,R=w=>ret(S.i[w.w],now);
 if(fn&&un.length)return{w:un[0],intro:1};
 if(L.length>5&&Math.random()<.12)return{w:rnd(L)};
 const due=L.filter(w=>R(w)<.9).sort((a,b)=>R(a)-R(b));
 if(due.length)return{w:due[0]};
 if(un.length&&nt<10)return{w:un[0],intro:1};
 if(L.length)return{w:L.sort((a,b)=>R(a)-R(b))[0]};
 return un.length?{w:un[0],intro:1}:null}
function practice(fn){const p=pick(fn),m=$('#m');
 if(!p){m.innerHTML='<div class="card"><p>You have met every word. Add more in Progress with Import.</p></div>';return}
 if(p.intro){const w=p.w;m.innerHTML=`<div class="card"><p class="mu">New word</p><div class="big">${ruby(w,1)}</div><p class="mean">${e(w.m)}</p><button class="pri" onclick="meet(${W().indexOf(w)})">Got it, quiz me</button></div>`;return}
 cur=build(p.w);show()}
function meet(i){const w=W()[i];S.i[w.w]={s:.5,d:5,t:Date.now(),f:Date.now(),n:0,l:0,x:{}};save();cur=build(w,'mj');show()}
function opts(w,key){const it=S.i[w.w],c=W().filter(x=>x.w!==w.w&&x[key]!==w[key]&&(key!='r'||K.test(x.w)));
 const wt=x=>1+(x.l==w.l?1:0)+[...x.w].filter(ch=>K.test(ch)&&w.w.includes(ch)).length*3+((it.x&&it.x[x.w])||0)*4,out=[];
 while(out.length<3&&c.length){let r=Math.random()*c.reduce((a,x)=>a+wt(x),0),i=0;for(;i<c.length-1;i++){r-=wt(c[i]);if(r<=0)break}out.push(c.splice(i,1)[0])}
 return shuffle(out.concat(w))}
function build(w,t){const it=S.i[w.w],k=K.test(w.w);let ts=['jm','mj'];if(k){ts.push('jr');if(it.s>=3)ts.push('tr')}
 ts=ts.filter(x=>x!=it.lt);t=t||rnd(ts.length?ts:['jm']);it.lt=t;
 return{w,t,o:t=='tr'?0:opts(w,{jm:'m',mj:'w',jr:'r'}[t])}}
function show(){const{w,t,o}=cur,it=S.i[w.w],pct=Math.round(ret(it,Date.now())*100);
 const q={mj:`<div class="big">${e(w.m)}</div><p class="mu">Which word is this?</p>`,jm:`<div class="big">${ruby(w,it.s<6)}</div><p class="mu">What does it mean?</p>`,jr:`<div class="big">${e(w.w)}</div><p class="mu">How is it read?</p>`,tr:`<div class="big">${e(w.w)}</div><p class="mu">Type the reading in kana</p>`}[t];
 let h=`<div class="card">${q}<div class="bar" title="how well you hold this word"><i style="width:${pct}%"></i></div>`;
 h+=t=='tr'?`<input id="ti" autocomplete="off" autocapitalize="off" aria-label="reading"><button class="pri" onclick="ans(0,$('#ti').value)">Check</button>`:o.map((x,i)=>`<button class="opt" onclick="ans(${i})">${e({jm:x.m,mj:x.w,jr:x.r}[t])}</button>`).join('');
 $('#m').innerHTML=h+'</div><div id="fb"></div>';
 if(t=='tr'){const i=$('#ti');i.focus();i.onkeydown=ev=>{if(ev.key=='Enter')ans(0,i.value)}}}
function ans(i,val){if(cur.done)return;cur.done=1;const{w,t,o}=cur,it=S.i[w.w],x=t=='tr'?null:o[i];
 const ok=t=='tr'?hira(String(val).trim())==hira(w.r):x.w==w.w,R=ret(it,Date.now());
 if(ok){it.s*=1.3+2.2*(1-R)+.15*(10-it.d);it.d=Math.max(1,it.d-.2)}
 else{it.s=Math.max(.4,it.s*.25);it.d=Math.min(10,it.d+1);it.l++;if(x)it.x[x.w]=(it.x[x.w]||0)+1}
 it.t=Date.now();it.n++;save();
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(o&&o[j].w==w.w)b.classList.add('ok');else if(j==i)b.classList.add('bad')});
 $('#fb').innerHTML=`<div class="card fb ${ok?'':'r'}"><b>${ok?'Correct':'Not quite'}</b><br>${e(w.w)} (${e(w.r)}) = ${e(w.m)}${!ok&&x?`<br><span class="mu">You chose ${e(x.w)} (${e(x.r)}) = ${e(x.m)}</span>`:''}<button class="pri" onclick="practice()">Next</button></div>`}
function lab(){$('#m').innerHTML=LAB.map((u,i)=>`<div class="card"><b>${e(u.t)}</b>${S.lab[i]==1?' (solved)':''}<div class="ex">${u.ex.map(x=>`<span><big>${e(x[0])}</big><small>${e(x[1])}</small></span>`).join('')}</div><p>${e(u.q)}</p><div id="lq${i}">${u.o.map((o,j)=>`<button class="opt" onclick="lq(${i},${j})">${e(o)}</button>`).join('')}</div></div>`).join('')}
function lq(i,j){const u=LAB[i];S.lab[i]=j==u.a?1:0;save();const c=$('#lq'+i);c.querySelectorAll('button').forEach((b,k)=>{b.disabled=true;if(k==u.a)b.classList.add('ok');else if(k==j)b.classList.add('bad')});c.insertAdjacentHTML('beforeend',`<p class="mu">${e(u.y)}</p>`)}
function prog(){const A=W(),n=Date.now(),L=A.filter(w=>S.i[w.w]),sol=L.filter(w=>S.i[w.w].s>=7).length;
 $('#m').innerHTML=`<div class="card"><b>${L.length}</b> words met, <b>${sol}</b> solid, ${A.length} in the deck</div><div class="card"><div class="grid">${A.map(w=>{const it=S.i[w.w],o=it?Math.max(.25,ret(it,n)):.08;return`<span style="opacity:${o}" title="${e(w.m)}">${e(w.w)}</span>`}).join('')}</div><p class="mu">Bright words are strong in memory. Faded ones are due for a visit.</p></div><div class="card"><button class="sec" onclick="exp()">Export JSON</button><label class="btn">Import JSON<input type="file" accept=".json" hidden onchange="imp(this)"></label><button class="sec" onclick="rst()">Reset</button><p class="mu">Import also accepts {"words":[{"w":"猫","r":"ねこ","m":"cat","l":5}]} to add vocabulary.</p></div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='nihongo-lab-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(f){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);
 Object.entries(j.i||{}).forEach(([k,v])=>{if(!S.i[k]||(v.t||0)>S.i[k].t)S.i[k]=v});Object.assign(S.lab,j.lab||{});
 (j.custom||j.words||[]).forEach(x=>{if(x.w&&x.r&&x.m&&!W().some(y=>y.w==x.w))S.custom.push({w:x.w,r:x.r,m:x.m,l:+x.l||5})});
 save();prog()}catch(x){alert('That file is not a valid Nihongo Lab export.')}};r.readAsText(f.files[0])}
function rst(){if(confirm('Erase all progress on this device?')){S.i={};S.lab={};save();prog()}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go('p');
</script></body></html>
